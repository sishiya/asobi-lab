:root{--bg:#f3eedf;--ink:#24281e;--muted:#6a6a58;--line:#d8d0b8;--card:#fbf8ef;--accent:#4f7a2a;color-scheme:light dark}

h2{font-size:13px;color:var(--muted);margin:32px 0 8px;font-weight:700;letter-spacing:.08em}
table{width:100%;border-collapse:collapse;font-size:13px}
