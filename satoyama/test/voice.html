// 声の子の 生む・育てる（GAME.md 段階「声の子」）。上のタブ 生む／育てる／走る で場面を分け、下のメニュー（押しながら話す・声のみほん）は共通。声の意味だけがタブで変わる

await R.init();

document.body.appendChild(renderer.domElement);

const cam = new THREE.PerspectiveCamera(38, 1, 0.01, 60);

const sun = new THREE.DirectionalLight(0xfff0d6, 2.2); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 4;
Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: 0.5, far: 20 }); scene.add(sun, sun.target);
makeFeltGround(scene, { size: 10, n: 180, cx: 1, cz: 0 });
const DIO = makeDiorama(renderer, scene, cam);
const $ = id => document.getElementById(id);
let msgT = 0; function show(s) { $('msg').textContent = s; $('msg').style.opacity = 1; clearTimeout(msgT); msgT = setTimeout(() => ($('msg').style.opacity = 0), 2200); }

// 巣（草原のすみ、育てる子が歩く所から 4m ほど）: わら色のフェルトの玉を輪に、そばに石
const NEST = [2.5, -3.2], ny = height(...NEST);
{ for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2, r = 0.2 + 0.02 * Math.sin(i * 2.3), b = makeFeltBall([0.74 - 0.05 * (i % 3), 0.64 - 0.04 * (i % 2), 0.42], { r: 0.04, sx: 1.8, sy: 0.7 });

  const bed = makeFeltBall([0.66, 0.56, 0.36], { r: 0.2, sy: 0.12 }); bed.position.set(NEST[0], ny + 0.004, NEST[1]); scene.add(bed);
  for (const [dx, dz, r] of [[-0.45, 0.2, 0.07], [-0.36, 0.36, 0.045], [0.42, -0.3, 0.06]]) { const st = makeFeltBall([0.6, 0.6, 0.57], { r, sy: 0.6 }); st.position.set(NEST[0] + dx, height(NEST[0] + dx, NEST[1] + dz) + r * 0.3, NEST[1] + dz); scene.add(st); } }

// 子: 遺伝子 → 体と皮。練習の結果（歩き方の数）が届くたびに入れかえる
// 育つ様子を早送りしないで見せる: 練習の1世代に最短 2.5 秒かけ、画面の子は「いま試している歩き方」で歩く（はじめはばたついて、だんだんそろう）

// saved＝残してある子（遺伝子・歩き方・練習の続き）。FB を渡すと、その皮を新しい体に付けかえる（生むから連れてきた子）
function raise(saved, FB0 = null) {
  if (worker) worker.terminate();
  if (kid) kid.FB.dispose();
  const genes = saved.genes;
  if (kid) { for (const p of Object.values(kid.H.parts)) world.removeRigidBody(p.body); }
  t = 0; fallT = 0; morph = null;
  const B = kidBody(genes), H = B.build(R, world, [0, 0, 0], height);
  let FB = FB0; if (FB) FB.rebind(H, 0); else FB = makeFeltBody(scene, H, kidShapes(H), { furColor: lookFur(genes.look, H), face: lookFace(genes.look, H.plan, HARE_FACE) });

  kid = { name: saved.name || kidName(genes.look), H, B, q: B.decode(saved.trying || KID_SEED), FB, genes, best: saved.v || null, trying: saved.trying || KID_SEED, state: saved.state || null, getup: saved.getup || null };
  const s = saved.state; info = { gen: s?.gen ?? 0, tries: s?.tries ?? 0, firstWalk: s?.firstWalk ?? null, stage: s?.st ?? 1, steady: s?.steady, done: s?.done, restarts: s?.restarts };
  $('name').value = kid.name; tabs();
  if (info.done && kid.getup?.learned) return; // 歩く・起き上がるの練習が終わっていれば回さない
  worker = new Worker(new URL('../js/practice-worker.js', import.meta.url), { type: 'module' });
  worker.onmessage = e => { const m = e.data; if (m.end) return; if (m.getup) { kid.getup = m.getup; keep(); return; } info = { ...info, ...m }; kid.q = B.decode(m.trying); kid.trying = m.trying; if (m.v) kid.best = m.v; kid.state = m.state; keep(); };
  worker.postMessage({ genes, pace: 2.5, seed: (Math.random() * 1e9) | 0, resume: kid.state, getupResume: kid.getup?.state }); // 練習に渡すのは遺伝子の数だけ
}
const keep = () => kid && saveKid({ name: kid.name, genes: kid.genes, v: kid.best, trying: kid.trying, state: kid.state, getup: kid.getup, mud: kid.FB.mud.blobs }); // 名前も端末の中だけ
// 名前: 左上の名前を押すと書きかえられる（Enter か、ほかを押すと決まる。からっぽなら元の名前）
$('name').addEventListener('change', () => { if (!kid) return; kid.name = $('name').value.trim() || kid.name; $('name').value = kid.name; keep(); });
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); e.stopPropagation(); });
$('candName').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); e.stopPropagation(); });

// 生む（ユーザー「一言では生まれず、しばらく声をかけつづけるとたまっていき、たまり切ると生まれる」「命の誕生だ。こだわって魅せていこう」）
// 声をかけるたびに、その声の色の羊毛のふさがまわりからうずを巻いて巣へ集まり、巻きついてたまごが育つ（針で刺して固める羊毛フェルトの作り方の見立て）。
//   ゲージはたまごそのもの: 大きさ・固さ（まわりのゆるい毛羽が減る）・声ごとの色のマーブル。生まれる子は、かけた声ぜんぶを混ぜた遺伝子
// いっぱいになると: 心臓の拍のようにゆっくりふくらむ → 内から温かい光 → ゆれる → 花のように花びらに分かれて開く → 中の子が最初のひと息・耳を立てる。花びらは巣の敷き物に
let cand = null, egg = null, nestWorld = null, nt = 0, lining = [];
const EGG_R = 0.14, EGG = [1.18, 1.05, 1.18]; // たまごの大きさ（中の子がかくれる）
const eggAt = () => new THREE.Vector3(NEST[0], ny + EGG_R * EGG[1] * 0.92, NEST[1]);
function newEgg() {
  lining.forEach(p => scene.remove(p.g)); lining = [];
  const m = makeFeltBall([0.92, 0.88, 0.8], { r: EGG_R, sx: EGG[0], sy: EGG[1], sz: EGG[2], seg: 40, fuzz: 4, len: 0.012 }); // 毛羽の層つき（はじめはふわふわ、刺して固めると短く）
  m.position.copy(eggAt()); m.scale.setScalar(0.001); scene.add(m);
  return { m, voices: [], fill: 0, shown: 0, firm: 0, poke: 0, tufts: [], wraps: [], t: 0, phase: 'gather', light: null, petals: [], seeds: [] };
}
// 声ごとの色を、たまごの表にうずのマーブルで（はじめの声が下に、あとの声ほど上に巻く）
function marble(V, x, y, z) { // y＝たまごの高さ -1..1
  const a = Math.atan2(z, x), u = (y * 0.5 + 0.5) * V.length + 0.35 * Math.sin(a * 2 + y * 5) + 0.15 * Math.sin(a * 5 - y * 9), k = Math.max(0, Math.min(V.length - 1, Math.floor(u))), f = u - Math.floor(u);
  const A = V[k].col, B = V[Math.min(V.length - 1, k + 1)].col, s = f > 0.82 ? (f - 0.82) / 0.18 : 0; // 帯の境はなめらかに
  return [A[0] + (B[0] - A[0]) * s, A[1] + (B[1] - A[1]) * s, A[2] + (B[2] - A[2]) * s];
}
function paintEgg() {
  const g = egg.m.geometry, p = g.attributes.position, c = g.attributes.color, V = egg.voices.filter(v => v.arrived);
  if (!V.length) return;
  for (let i = 0; i < p.count; i++) c.setXYZ(i, ...marble(V, p.getX(i), p.getY(i) / (EGG_R * EGG[1]), p.getZ(i)));
  c.needsUpdate = true;
}
// 巻きつく羊毛の帯（本物の羊毛フェルトも、ふわふわの原毛の帯を芯に巻いて足す）: たまごの表に沿う、はばの広いふんわりした帯を、少しずつ巻いていく
//   巻いたあとは、刺して固めるうちに帯の境がなじんで消える（色はたまごの表に写してあるマーブル）
function wrap(v) {
  for (let i = 0; i < 3; i++) {
    const n = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize(), u = new THREE.Vector3(0, 1, 0).cross(n); if (u.lengthSq() < 1e-3) u.set(1, 0, 0); u.normalize(); const w = n.clone().cross(u);
    const N = 80, W = 0.03 + Math.random() * 0.012, pos = [], idx = [], P = k => { const t = k / N * Math.PI * 2.2, q = u.clone().multiplyScalar(Math.cos(t)).addScaledVector(w, Math.sin(t)); return new THREE.Vector3(q.x * EGG_R * EGG[0], q.y * EGG_R * EGG[1], q.z * EGG_R * EGG[2]); };
    for (let k = 0; k <= N; k++) {
      const p = P(k), nn = p.clone().normalize(), tg = P(k + 1).sub(P(k - 1)).normalize(), side = nn.clone().cross(tg).normalize(), taper = Math.min(1, k / 8, (N - k) / 8), hw = W * 0.5 * (0.35 + 0.65 * taper);
      const a = p.clone().addScaledVector(nn, 0.003).addScaledVector(side, hw), b2 = p.clone().addScaledVector(nn, 0.003).addScaledVector(side, -hw); pos.push(a.x, a.y, a.z, b2.x, b2.y, b2.z);
      if (k < N) { const j = k * 2; idx.push(j, j + 1, j + 2, j + 1, j + 3, j + 2); }
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
    const m = feltMesh(g, i % 2 ? v.pale : v.col, { side: THREE.DoubleSide });
    for (let k = 1; k <= 3; k++) m.add(new THREE.Mesh(g, feltify(new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 1, sheen: 0.9, sheenRoughness: 0.8, sheenColor: 0xf2e6d4, side: THREE.DoubleSide }), { shell: k / 3, len: 0.006, freq: 330, rest: false }))); // 原毛のふんわりした毛羽
    g.setDrawRange(0, 0); egg.m.add(m); egg.wraps.push({ g, m, t: -i * 0.3, n: idx.length, age: 0 });

}
const fade = (o, a) => o.traverse(x => { if (x.material) { x.material.opacity = a; const tr = a < 0.999; if (x.material.transparent !== tr) { x.material.transparent = tr; x.material.needsUpdate = true; } x.material.depthWrite = a > 0.5; } }); // 毛羽の層ごと。透けるのはうすれるときだけ（ふだん透けるとガラスのように見える。透けるかを変えたら絵の準備をしなおす）
// 羊毛の束（原毛のひとつまみ）: 先が細くなる、少しうねった帯に、長い毛羽。楕円の玉だと毛に見えない（ユーザー）
function makeWisp(col, L = 0.1, W = 0.022) { // 細長くうねった、ふっくらした束（薄い帯だと裏から見て毛羽が片側だけになり、毛虫のように黒く見えた）
  const g = new THREE.SphereGeometry(1, 18, 10), p = g.attributes.position, ph = Math.random() * 6;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i) * L / 2, u = x / L + 0.5, taper = 0.35 + 0.65 * Math.sin(Math.PI * u); p.setXYZ(i, x, p.getY(i) * W * 0.32 * taper + Math.sin(u * 5 + ph) * 0.006, p.getZ(i) * W * 0.5 * taper + Math.sin(u * 3.1 + ph * 2) * 0.008); }
  g.computeVertexNormals();
  const m = feltMesh(g, col);
  for (let k = 1; k <= 5; k++) m.add(new THREE.Mesh(g, feltify(new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 1, sheen: 0.9, sheenRoughness: 0.8, sheenColor: 0xf2e6d4 }), { shell: k / 5, len: 0.009, freq: 330, rest: false })));
  m.castShadow = false; return m;
}
// ふさ: 細長い毛のかたまり。まわりの遠くから、うずを巻いて近づき、たまごの表に巻きつく
function sendTufts(v) {
  for (let i = 0; i < 16; i++) {
    const m = makeWisp(i % 4 ? v.col : v.pale, 0.07 + Math.random() * 0.06), a0 = Math.random() * Math.PI * 2, r0 = 0.7 + Math.random() * 0.6;
    fade(m, 0); scene.add(m);
    egg.tufts.push({ m, a0, r0, h0: 0.08 + Math.random() * 0.35, t: -i * 0.07, dur: 1.8 + Math.random() * 0.6, v });
  }
}
function stepEgg(dt) {
  const e = egg; e.t += dt; const c = eggAt();
