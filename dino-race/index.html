<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>恐竜かけっこ牧場</title>

<body class="app" data-screen="ranch">
<header class="top">
  <a class="back" href="../" aria-label="あそびラボへ戻る">←</a>
  <h1>恐竜かけっこ牧場</h1>
  <button type="button" class="icon-btn" id="btnHelp" aria-label="あそびかた">?</button>
  <button type="button" class="icon-btn" id="btnSound" aria-label="効果音" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="mute" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <button type="button" class="icon-btn" id="btnAbout" aria-label="メニュー"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
</header>

<!-- タイトル画面（読み込むたびに。?thumb のときは出さない） -->
<div class="title-screen" id="titleScreen" hidden>
  <div class="title-card">
    <svg class="title-logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--accent)"/><path d="M10 36c4-12 18-18 32-15 6 1 11 5 12 10l-2 3H40l-4 5H22l-8 4z" fill="var(--bone-hi)" stroke="var(--bone-hi)" stroke-width="2" stroke-linejoin="round"/><circle cx="22" cy="29" r="3.5" fill="var(--accent)"/><ellipse cx="34" cy="29" rx="4" ry="2.5" fill="var(--accent)"/><path d="M40 34l1 4M44 34l1 4M48 34l1 3" stroke="var(--accent)" stroke-width="1.6"/></svg>
    <h2>恐竜かけっこ牧場</h2>
    <p class="title-sub">恐竜をかけ合わせて育て、<br>物理の計算で本当に走らせる 100m かけっこ。</p>
    <div class="title-btns" id="titleBtns"></div>
    <button type="button" class="quiet title-help" id="btnTitleHelp">あそびかた</button>
    <p class="title-foot"><span id="titleVer"></span> ・ あそびラボ</p>
  </div>
</div>

<main id="app">
  <!-- 走るようす。牧場の画面では上に小さく（練習場）、かけっこと「走りを見る」の間は画面いっぱい（body.racing） -->
  <section class="stage" id="stage">
    <canvas id="view" aria-label="恐竜が走るようす"></canvas>
    <div class="count" id="count" aria-live="assertive" hidden></div>
    <ol class="board" id="board" aria-label="いまの順位"></ol>
    <div class="hud">
      <span id="hudText" class="hud-text">牧場の恐竜が、練習場を走っています</span>
      <button type="button" id="btnSpeed" class="chip-btn" aria-label="再生の速さ">×1</button>
      <button type="button" id="btnSkip" class="chip-btn" hidden>結果へ ▶</button>
    </div>
  </section>

  <!-- 画面ごとの中身（ここだけがスクロールする） -->
  <div class="screens" id="screens">
    <section class="screen" id="screen-ranch" aria-labelledby="tab-ranch">
      <div id="nextCup" class="banner next" hidden></div>
      <div id="evolveBanner" class="banner" hidden></div>
      <p class="hint" id="selHint">カードを押して選ぶ（かけ合わせは2匹、かけっこは4匹まで）。「…」で詳しく。</p>
      <div class="cards" id="ranch"></div>
    </section>

    <section class="screen" id="screen-kids" aria-labelledby="tab-kids" hidden>
      <div id="nurseryBox" class="nursery"></div>
    </section>

    <section class="screen" id="screen-cups" aria-labelledby="tab-cups" hidden>
      <div class="seg" id="tierSeg" role="tablist" aria-label="大会の段"></div>
      <div id="cupList"></div>
    </section>

    <section class="screen" id="screen-book" aria-labelledby="tab-book" hidden>
      <div class="seg" id="bookSeg" role="tablist" aria-label="記録帳のページ"></div>
      <div id="book"></div>
    </section>
  </div>
</main>

<!-- 選んだ恐竜への操作（牧場の画面で選んだときだけ。下のタブの上） -->
<div class="actbar" id="actbar" hidden>
  <span class="act-n" id="actN"></span>
  <button type="button" id="btnClearSel" class="quiet" aria-label="選ぶのをやめる">×</button>
  <button type="button" id="btnBreed">かけ合わせる</button>
  <button type="button" id="btnRace" class="primary">かけっこ</button>
</div>

<!-- 画面の切りかえ（下に固定） -->
<nav class="tabbar" role="tablist" aria-label="画面の切りかえ">
  <button type="button" role="tab" id="tab-ranch" aria-controls="screen-ranch" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-6 9 6v9H3z M9 20v-5h6v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>牧場 <small id="ranchCount"></small></span></button>
  <button type="button" role="tab" id="tab-kids" aria-controls="screen-kids" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="13.5" rx="6.5" ry="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 13l3 1.5 2-2 2.5 2 2-1.5 2.5 1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span>生まれた子</span><b class="badge" id="kidsCount" hidden></b></button>
  <button type="button" role="tab" id="tab-cups" aria-controls="screen-cups" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3l2 5M16 3l-2 5M12 11.5l.9 1.8 2 .3-1.4 1.4.3 2-1.8-1-1.8 1 .3-2-1.4-1.4 2-.3z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><span>大会 <small id="medalCount"></small></span></button>
  <button type="button" role="tab" id="tab-book" aria-controls="screen-book" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-5a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span>記録帳</span></button>
</nav>

<!-- 下からせり上がるシート（詳しく・結果・大会に出る恐竜・おまかせ・このゲームについて） -->
<dialog id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button type="button" class="icon-btn" id="btnSheetClose" aria-label="閉じる">×</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</dialog>

<!-- 確認・名前の入力（ブラウザの confirm／prompt の代わり） -->
<dialog id="ask" aria-labelledby="askMsg">
  <form method="dialog">
    <p id="askMsg"></p>
    <input type="text" id="askInput" autocomplete="off" hidden>
    <div class="btn-row"><button type="submit" value="cancel" id="askNo"></button><button type="submit" value="ok" id="askOk" class="primary"></button></div>
  </form>
</dialog>

<!-- 動かせないとき（ライブラリが読めない・思わぬエラー） -->
<div class="fatal" id="fatal" role="alert" hidden>
  <p id="fatalMsg"></p>
  <button type="button" class="primary" onclick="location.reload()">ページを読み直す</button>
</div>

<input type="file" id="importFile" accept=".json,application/json" hidden>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<template id="aboutTpl">
  <div class="about-body">
    <p>恐竜の体（骨の長さの比率・大きさ・筋肉の量）と走り方は、遺伝子で決まっています。走るようすは物理の計算（<a href="https://github.com/piqnt/planck.js">Planck.js</a>）で、骨を関節でつなぎ、筋肉の力で関節を動かしています。</p>
    <h3>本物のしくみ</h3>
    <ul>
      <li><b>大きいほど力が足りなくなる</b>: 体を2倍にすると、重さは8倍。筋肉の太さ（断面積）は4倍、筋肉が関節を回す力は8倍になりますが、重い体を長い脚で支えるのに要る力は16倍。だから大きいほど力に余裕がなくなります。筋肉の力は 1m² あたり 30 万N（Hutchinson &amp; Garcia 2002 が使った値）として、筋肉の体積から関節の力の上限を決めています。</li>
      <li><b>大きさに合ったリズム</b>: 1歩の長さの時間は「脚の長さ ÷ 重力」の平方根に比例させています（同じ形で、力が足りれば、大きさがちがっても同じ動き方になる「動的相似」。実際は大きいほど力が足りません）。だから小さい恐竜と大きい恐竜をかけ合わせても、走り方を受けつげます。</li>
      <li><b>足あとから速さを推定</b>: かけっこの結果に、歩幅と腰の高さから速さを出す Alexander（1976）の式の値も出しています。化石の足あとから恐竜の速さを見積もるのに使われる式です（実際の化石では、腰の高さを足あとの長さのおよそ4倍として見積もります）。</li>
      <li><b>研究の推定</b>: 記録帳では、Sellers &amp; Manning（2007）が骨格の模型を進化させて見積もった最高速度（ティラノサウルス 秒速 8.0m、ヴェロキラプトル 10.8m、コンプソグナトゥス 17.8m など）とくらべます。研究によって推定には幅があります。</li>
      <li><b>転ばない足の置き方</b>: 走り方のしくみは、二足のキャラクターの研究 SIMBICON（Yin ら 2007）に寄せています。重心が足より前にあるほど、また速いほど、次の足を前に出します。</li>
      <li><b>遺伝</b>: 子の体は両親のあいだ（ときどき少しはみ出す）、走り方は片方の親から丸ごと受けつぎ、少しだけ変わります（突然変異）。練習では体はそのままで、走り方だけを少しずつ変えながら試し、よかったものを覚えます。</li>
    </ul>
    <h3>簡単にしたところ</h3>
    <ul>
      <li>体重はティラノサウルス 8.3t・ヴェロキラプトル 16kg・コンプソグナトゥス 1.7kg・ストルティオミムス 150kg ほどで、研究の推定の幅の中です（Hutchinson ら 2011、Turner ら 2007 など）。骨の長さの比率は傾向を合わせた仮の値です。</li>
      <li>体の密度を水と同じにしています（本物は気嚢＝空気の袋があって、もう少し軽い）。</li>
      <li>横から見た2次元です。2本の脚は同じ平面にあり、恐竜どうしはぶつかりません。</li>
      <li>筋肉は関節ごとのモーター（力の上限つき）です。疲れや、腱のばねはまだありません。</li>
      <li>大会のゴースト（人・ゾウ・ダチョウ）は、100m を同じ速さで走る目安の線です。</li>
      <li>「本番の調子」は、走り方の遺伝子をほんの少し（範囲の 0.4% ほど）ずらして表しています。</li>
    </ul>
    <h3>おもな出どころ</h3>
    <ul class="refs">
      <li>Sellers, W.I. &amp; Manning, P.L. (2007) Estimating dinosaur maximum running speeds using evolutionary robotics. <i>Proc. R. Soc. B</i> 274: 2711–2716.（骨格を物理の中で進化させて走らせる研究。このゲームの元のアイデア）</li>
      <li>Hutchinson, J.R. &amp; Garcia, M. (2002) Tyrannosaurus was not a fast runner. <i>Nature</i> 415: 1018–1021.</li>
      <li>Hutchinson, J.R. ら (2003) Are fast-moving elephants really running? <i>Nature</i> 422: 493–494.（タイのアジアゾウの速さ）</li>
      <li>Hutchinson, J.R. ら (2011) A computational analysis of limb and body dimensions in <i>Tyrannosaurus rex</i> with implications for locomotion, ontogeny, and growth. <i>PLoS ONE</i> 6: e26037.</li>
      <li>Turner, A.H., Makovicky, P.J. &amp; Norell, M.A. (2007) Feather quill knobs in the dinosaur <i>Velociraptor</i>. <i>Science</i> 317: 1721.（ヴェロキラプトルの体重）</li>
      <li>Persons, W.S. &amp; Currie, P.J. (2016) An approach to scoring cursorial limb proportions in carnivorous dinosaurs and an attempt to account for allometry. <i>Scientific Reports</i> 6: 19828.（獣脚類の脚の比率）</li>
      <li>Holtz, T.R. (1995) The arctometatarsalian pes, an unusual structure of the metatarsus of Cretaceous Theropoda. <i>J. Vertebrate Paleontology</i> 14: 480–519.（オルニトミムス類の長い足の甲）</li>
      <li>Alexander, R.McN. (1976) Estimates of speeds of dinosaurs. <i>Nature</i> 261: 129–130.</li>
      <li>Yin, K., Loken, K. &amp; van de Panne, M. (2007) SIMBICON: Simple Biped Locomotion Control. <i>ACM Transactions on Graphics</i> 26(3).</li>
    </ul>
  </div>
</template>
