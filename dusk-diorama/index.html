<body>
<canvas id="c"></canvas>
<!-- 上のまん中: 夜明けまで -->
<div class="night" aria-label="夜明けまで"><span id="nightNo" class="nightno">第1夜</span><span class="moon"></span><span class="track"><span id="bar"></span></span><span class="sun"></span></div>
<p id="wx" class="wx"></p>
<p id="hint" class="hint" hidden>燃えるものを つまんで 火へ</p>
<p id="tag" class="tag" hidden></p>
<p id="toast" class="toast"></p>
<section id="title" class="card title">
  <h1>夜明けまでの島</h1>
  <p>火の光がとどかない所から、島は闇に崩れていく。<br>燃えるものをつまんで、火にくべよう。<br>ただし、くべたものは もどらない。</p>
  <button id="start" class="btn">はじめる</button>
  <p class="small">ドラッグで島を回す・ホイールで寄る　ver. 0.4（試作）</p>
  <div class="pick" aria-label="テスト用: 夜をえらぶ"><span>テスト用: 夜をえらぶ</span><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button></div>
</section>
<section id="result" class="card result" hidden>
  <h2 id="resTitle"></h2>
  <p id="resLead"></p>
  <div id="resRows" class="rows"></div>
  <div class="btns"><button id="next" class="btn">次の夜へ</button><button id="again" class="btn sub">はじめから</button></div>
</section>
<script type="module" src="js/game.js?v=9"></script>
</body>
</html>
