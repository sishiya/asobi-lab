<title>32ビット互換機（試作）</title>

<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/no-quirks.css"><script src="../assets/no-quirks.js" defer></script>

<body>
<!-- 区割り: 上 = 機械の名前（右にめったに使わない道具: ことば）、まん中 = 画面、下 = ソフトの札と操作（開く・止める・はじめから） -->
<div class="app">
  <header class="top">
    <div class="name">
      <small><span lang="ja">あそびラボ</span><span lang="en">Asobi Lab</span></small>
      <h1><span lang="ja">32ビット互換機</span><span lang="en">32-bit Console</span></h1>
      <span class="ver">ver. 0.1</span>
    </div>
    <div class="langsw" role="group" aria-label="言語 Language"><button type="button" data-lang="ja" aria-label="日本語">JP</button><button type="button" data-lang="en" aria-label="English">EN</button></div>
  </header>

  <main class="stage">
    <div class="bezel">
      <canvas id="screen" width="640" height="480" aria-label="画面" data-en-label="Screen"></canvas>
      <p class="msg" id="msg" hidden></p>
    </div>
  </main>

  <footer class="deck">
    <div class="discs" id="discs" role="group" aria-label="ソフト" data-en-label="Software"></div>
    <div class="ctl">
      <button type="button" class="tool" id="btnOpen"><span aria-hidden="true">⏏</span> <span lang="ja">自分のファイルを開く</span><span lang="en">Open your file</span></button>
      <button type="button" class="tool icon" id="btnPause" aria-label="一時停止" data-en-label="Pause"><span aria-hidden="true">⏸</span></button>
      <button type="button" class="tool icon" id="btnReset" aria-label="はじめから" data-en-label="Restart"><span aria-hidden="true">↺</span></button>
      <input type="file" id="file" accept=".exe,application/octet-stream" hidden>
    </div>
    <p class="note"><span lang="ja">試作（段階A: CPU と絵）。自分のファイルはこの端末の中だけで読み、どこにも送りません。権利を持っているファイルだけを開いてください。</span><span lang="en">Prototype (stage A: CPU and graphics). Your file is read only on this device and never sent anywhere. Open only files you have the rights to.</span>
      <a href="../archive.html"><span lang="ja">あそびラボの保管庫へ</span><span lang="en">Asobi Lab archive</span></a></p>
  </footer>
</div>
<script type="module" src="js/main.js?v=1"></script>
</body>
</html>
