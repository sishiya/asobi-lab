<body>
<div id="app">
  <canvas id="view" aria-label="勇者と荷物持ちの旅を横から見た絵本の場面"></canvas>

  <!-- 上: いまの状態（日・場所）。左上は勇者の顔の窓（canvas に描く） -->
  <header id="top">
    <div id="dayTag" hidden><b id="dayNo"></b><span id="dayPlace"></span></div>
    <p id="guide" hidden></p>
  </header>
  <div id="corner"><button class="chip" id="btnSound" aria-pressed="true">音</button></div>

  <!-- 下: 手でさわるもの -->
  <section id="panel" hidden></section>

  <!-- 重ねて出す画面 -->
  <div class="ov" id="titleOv">
    <div class="book">
      <p class="kicker">あそびラボ ・ 試作</p>
      <h1>勇者は今日も<br>腹をこわす</h1>
      <p class="tag">気がつくと、剣と魔法の世界にいた。<br>あなたは戦えない。でも、勇者の荷物は持てる。</p>
      <button class="btn go" id="btnNew">旅に出る</button>
      <button class="btn sub" id="btnCont" hidden>つづきから</button>
      <p class="ver"><span id="verTxt"></span> ・ <a href="../archive.html">あそびラボの保管庫へ</a></p>
    </div>
  </div>
  <div class="ov" id="reviewOv" hidden><div class="book" id="reviewBox"></div></div>
  <div class="ov" id="endOv" hidden><div class="book diary" id="endBox"></div></div>
</div>
<script type="module" src="js/main.js?v=1"></script>
</body>
