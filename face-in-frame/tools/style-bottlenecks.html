<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>名画の顔ハメ スタイルの特徴</title>
</head>
<body>
<p>絵ごとに「スタイルの特徴」（100 の数）を計算する。結果は window.STYLES（tools/style-bottlenecks.mjs が js/styles.js に書く）。</p>
<script src="../vendor/tfjs/tf.min.js"></script>
<script type="module">
// 開発用: Magenta の任意スタイル変換のうち、スタイルを読むほう（MobileNet 版、9.5MB）は公開せず、ここで一度だけ使う。
// モデルは _dev/face-in-frame/style-predictor/（reiinakano/arbitrary-image-stylization-tfjs の saved_model_style_js。Apache-2.0）
import { PAINTINGS } from '../js/paintings.js';
const net = await tf.loadGraphModel('../../_dev/face-in-frame/style-predictor/model.json');
const out = {};
for (const p of PAINTINGS) {
  const img = new Image();
  await new Promise((ok, ng) => { img.onload = ok; img.onerror = ng; img.src = '../' + p.src; });
  // 顔のまわり（顔のはばの 3 倍の正方形）を 256×256 に。肌の筆づかいと、まわりの色をいっしょに読む
  const W = img.width, f = p.face, side = Math.min(img.width, img.height, (f.right - f.left) * W * (p.styleCrop || 3)); // styleCrop: 顔のはばの何倍を読むか（絵ごと）
  const cx = (f.nx + (f.left + f.right) / 2) * W, cy = f.ny * W;
  const x = Math.max(0, Math.min(img.width - side, cx - side / 2)), y = Math.max(0, Math.min(img.height - side, cy - side / 2));
  const c = Object.assign(document.createElement('canvas'), { width: 256, height: 256 });
  c.getContext('2d').drawImage(img, x, y, side, side, 0, 0, 256, 256);
  const v = tf.tidy(() => net.predict(tf.browser.fromPixels(c).toFloat().div(255).expandDims()));
  out[p.id] = Array.from(await v.data()).map(n => Math.round(n * 1e4) / 1e4);
  v.dispose();
}
window.STYLES = out;
document.title += ' 完了';
</script>
</body>
</html>
