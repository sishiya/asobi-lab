<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>名画の顔ハメ 絵のしらべ</title>
<style>
body{margin:0;background:#222;color:#eee;font:13px/1.5 system-ui,sans-serif;padding:16px}
.row{display:flex;gap:16px;align-items:flex-start;margin-bottom:24px}
canvas{max-height:420px;background:#000}
pre{white-space:pre-wrap;margin:0;max-width:560px}
</style>
</head>
<body>
<p>絵に Face Landmarker をかけて、穴の位置（だ円）と表情の数を出す。結果は window.RESULTS。</p>
<div id="out"></div>
<script type="module">
// 開発用: 絵ごとの穴とお手本の数の下書きを作る（手で直して js/paintings.js へ）
import { createLandmarker, readFace, areaBox, AREAS } from '../js/face.js';
import { PAINTINGS } from '../js/paintings.js';
const lmk = await createLandmarker('IMAGE');
window.RESULTS = {};
for (const p of PAINTINGS) {
  const img = new Image(); // decode() は画面が隠れていると終わらないことがあるので onload で待つ
  await new Promise((ok, ng) => { img.onload = ok; img.onerror = ng; img.src = '../' + p.src; });
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const res = lmk.detect(img);
  const f = readFace(res, img.width, img.height, false);
  const row = document.createElement('div'); row.className = 'row';
  const pre = document.createElement('pre');
  if (f) {
    g.strokeStyle = '#0f0'; g.lineWidth = 3;
    for (const q of res.faceLandmarks[0]) g.fillRect(q.x * img.width - 1, q.y * img.height - 1, 2, 2);
    g.strokeRect(f.box.x - f.box.w / 2, f.box.y - f.box.h / 2, f.box.w, f.box.h);
    const r = (v) => Math.round(v * 100) / 100;
    // face: paintings.js の face にそのまま写せる形（絵のよこはばを 1 とした割合）
    const q = v => Math.round(v / img.width * 10000) / 10000;
    const face = Object.fromEntries(Object.entries(f.lines).map(([k, v]) => [k, k === 'rot' ? Math.round(v * 10) / 10 : q(v)]));
    window.RESULTS[p.id] = { size: [img.width, img.height], face, box: f.box, roll: r(f.roll), yaw: r(f.yaw), ex: Object.fromEntries(Object.entries(f.ex).map(([k, v]) => [k, r(v)])) };
    pre.textContent = p.id + '\n' + JSON.stringify(window.RESULTS[p.id], null, 1);
  } else { pre.textContent = p.id + '\n顔が見つからない'; window.RESULTS[p.id] = null; }
  // くり抜く所の3つの箱（鼻から下・目から下・顔ぜんぶ）
  const L = Object.fromEntries(Object.entries(p.face).map(([k, v]) => [k, k === 'rot' ? v : v * img.width]));
  AREAS.forEach((ar, n) => { const b = areaBox(L, ar); g.save(); g.translate(b.x, b.y); g.rotate(b.rot * Math.PI / 180);
    g.strokeStyle = ['#f0f', '#ff0', '#0ff'][n]; g.lineWidth = 3; g.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h); g.restore(); });
  row.append(c, pre); out.append(row);
}
document.title += ' 完了';
</script>
</body>
</html>
