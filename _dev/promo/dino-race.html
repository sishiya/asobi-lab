<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="dino-race-common.js"></script>
<script>
'use strict';
// 台本: 恐竜かけっこ牧場（ショート、縦長 40秒。?short で開く）
// 上にかけっこ（ゲームの絵そのまま）、下に字幕。下の約25%は YouTube の表示が重なるので何も置かない
const CW = 540, CH = 560, TOP = 110;   // かけっこの絵（css の大きさ。4倍で描く）と、置く高さ（PW×PH の座標）
let SC = [];
const CAPS = [
  { a: 6.0, b: 13.6, main: '体の形と走り方は、遺伝子で決まる', sub: 'ティラノサウルス・ヴェロキラプトル・コンプソグナトゥス',
    en: ['Body shape and running style are set by genes', 'Tyrannosaurus, Velociraptor, Compsognathus'] },
  { a: 14.2, b: 18.8, main: 'かけ合わせた子は、うまく走れない', sub: 'ラプトル × ティラノの子（1.5t）',
    en: ['Their offspring can\'t run well at first', 'A Velociraptor × T. rex hybrid (1.5 t)'] },
  { a: 19.2, b: 24.0, main: '練習すると、走りきった！', sub: '上から 練習なし／1回／3回',
    en: ['With practice, it makes it to the finish!', 'From the top: no practice / once / three times'] },
  { a: 24.6, b: 29.8, main: '人の世界記録 9.58秒に挑む', sub: '100m。旗と点線が人の世界記録の速さ',
    en: ['Taking on the human world record: 9.58 s', '100 m. The flag and dotted line run at world-record pace'] },
  { a: 30.2, b: 35.0, main: '8.83秒。人の世界記録に勝った！', sub: 'ラプトルどうしの子',
    en: ['8.83 seconds. Faster than the human record!', 'Offspring of two Velociraptors'] },
];
const NAME = '恐竜かけっこ牧場', SUB = '恐竜をかけ合わせて育て、物理で走らせる';
const END_LINE = 'ブラウザで遊べます（パソコン・スマホ）';
const CREDIT = 'おもな出どころ: Sellers & Manning（2007）、Hutchinson & Garcia（2002）、Alexander（1976）';
promoStart({
  name: NAME, out: 'dino-race', src: '../../dino-race/index.html', iw: 1080, ih: 1920, dur: SHORT_END + IDENT_CLOSE, peek: 20,
  inject: { dpr: DR.dpr, raf: true },
  music: { style: 'journey', root: 146.83, stopAt: SHORT_END, cues: [{ t: SHORT_END, type: 'jingle' }] },
  subs: shortSubs(NAME, 'Dino Dash Ranch', SUB, 'Breed dinosaurs and race them with real physics', CAPS, END_LINE, 'Play in your browser (PC or phone). On-screen text is in Japanese for now'),
  ready: w => drReady(w),
  setup(w) {
    drCanvas(w, CW, CH);
    const G = DR.G, st = id => drStarter(w, id);
    SC = [
      { a: 0, b: 14, key: 'starters', lanes: [[st('trex'), 'ティラノサウルス'], [st('raptor'), 'ヴェロキラプトル'], [st('compy'), 'コンプソグナトゥス']], from: 1.5 },
      // 練習の前と後（3回目は 33.67秒でゴールするので、3.6倍で見せる）
      { a: 14, b: 24.3, key: 'practice', lanes: [[G.kids[0], 'ラプティ 1号（練習なし）'], [G.p1, '練習 1回'], [G.p3, '練習 3回']], speed: 3.6 },
      { a: 24.3, b: 99, key: 'record', lanes: [[G.fast, 'ラプトル 4号']], ghosts: ['human'], from: -0.4 },
    ];
    return null;
  },
  renderAt(t) { drRender(SC, t, CW, CH); },
  drawSource(g) {
    const R = RES;
    g.fillStyle = '#16120d'; g.fillRect(0, 0, PW * R, PH * R);
    g.drawImage(DR.cv, 0, TOP * R, PW * R, CW && PW * R * CH / CW);
  },
  overlay(g, t) {
    drawCaps(g, t, CAPS);
    drawShortChrome(g, t, NAME, SUB, END_LINE, CREDIT);
  },
  short: { iw: 1080, ih: 1920 },
});
drLoad();
</script>
</body>
</html>
