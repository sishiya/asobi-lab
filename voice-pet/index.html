<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='18' rx='11' ry='10' fill='%23e8936e'/%3E%3Ccircle cx='12' cy='16' r='2.2' fill='%23140d18'/%3E%3Ccircle cx='20' cy='16' r='2.2' fill='%23140d18'/%3E%3Cpath d='M7 10 L10 3 L13 9 M19 9 L22 3 L25 10' fill='%23e8936e'/%3E%3C/svg%3E">
<title>こえのこ</title>
<meta name="description" content="声をふきこむと、たまごがかえる。声の高さや響きが遺伝子になって、その子の形と鳴き声が決まる。声は端末の中だけで読み、送らない・保存しない。試作。">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/no-quirks.css"><script src="../assets/no-quirks.js" defer></script>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<canvas id="stage" aria-label="巣の上のたまごと生き物"></canvas>

<header class="top">
  <h1>こえのこ <small>試作</small></h1>
  <div class="tools">
    <button type="button" id="genesToggle" class="chip only-narrow">遺伝子</button>
    <button type="button" id="again" class="chip only-hatched">新しいたまご</button>
    <button type="button" id="sound" class="chip icon" aria-pressed="true" aria-label="音">♪</button>
  </div>
</header>

<aside id="genes" hidden>
  <h2>この子の遺伝子</h2>
  <ol id="geneList"></ol>
  <p class="note"><i class="real">●</i> は本物のしくみが手本。ほかは見立て。棒の上の2本の線は、2本ある遺伝子のそれぞれ。</p>
</aside>

<div class="dock">
  <p id="hint" role="status"></p>
  <button type="button" id="mic" aria-label="押しているあいだ声を入れる">
    <span id="ring"></span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <p class="privacy">声はこの端末の中だけで読み、送りも保存もしません</p>
</div>

<dialog id="bye">
  <p>この子とお別れして、<br>新しいたまごにしますか？</p>
  <div class="row"><button type="button" id="byeNo" class="chip">やめる</button><button type="button" id="byeYes" class="chip strong">新しいたまご</button></div>
</dialog>

<script type="module" src="js/main.js?v=2"></script>
</body>
</html>
