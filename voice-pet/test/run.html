  .tabs a.on { background: var(--on); color: #fff; }

  @media (max-width: 720px) { body.kid #tools { top: 62px; } } /* せまい画面では、育てる／走る の切りかえとカメラのボタンが重ならないよう、カメラを下へ */
  #need { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: var(--panel); border-radius: 14px; padding: 10px 16px; text-align: center; line-height: 1.6; }

<nav class="tabs" id="tabs" hidden><a href="voice.html#birth">生む</a><a href="voice.html#grow">育てる</a><a class="on">走る</a></nav>

<div id="tools"><div class="grp" id="cams"><button data-v="follow" class="on">追う</button><button data-v="tps">肩ごし</button><button data-v="fps">目線</button><button data-v="top">見下ろし</button></div><button class="tg" id="steady">揺れ おさえる</button><button class="tg" id="inv" hidden>上下 逆</button><button class="tg" id="rain">雨</button></div>
<div id="msg"></div>
<div id="hint">行きたい所をさわる（矢印キー・WASD でも）</div>
<script type="module">
// 入って走る試し（GAME.md 8章の「遊べる最小の形」）: 学習した跳び方のノウサギに、向き（turn）と速さ（g）だけを渡す。関節は操らない
// 見た目は羊毛フェルトのジオラマ（js/felt.js、LOOKDEV.md）。ぬかるみを通ると泥がつき、雨で落ちる（js/dirt.js）
// 目当ての藪へ走らせて、着くまでの秒・転んだ回数・入力から曲がり始めるまでの遅れを測る（window.__run.stats）
import * as THREE from 'three';
import R from '@dimforge/rapier3d-compat';
import { height, SIZE } from '../js/ground.js';
import { buildHare, drive, pose, decodeParams, PARAMS, setAnatomical } from '../js/hare.js';
import { makeField, contactPoint } from '../js/trial.js';
import { hareShapes, hareFurColor, hareBends, HEAD_OFF } from '../js/flesh-hare.js';
import { mud, makeDirt, stepDirt, MUD_WET } from '../js/dirt.js';
import { feltify, makeFeltGround, makeFeltBody, makeDiorama, HARE_FACE } from '../js/felt.js';
import { kidBody, kidShapes } from '../js/kid.js';
import { lookFur, lookFace } from '../js/kid-look.js';
import { loadKid, saveKid } from '../js/kid-store.js';
import { driveGetup, decodeGetup, GETUP_UP } from '../js/getup.js';
await R.init();
const qs = new URLSearchParams(location.search);
let v = PARAMS.map(() => 0.5);
try { const j = (await (await fetch(`../js/gait-hare-${qs.get('gait') || 'turn2'}.json`, { cache: 'no-store' })).json()); v = j.v; setAnatomical(!!j.anat); } catch (e) { /* まだ学習していない */ } // anat＝関節を本物の向きだけにした体で覚えた跳び方
// ?kid=1: 声から生まれた子に入る（test/voice.html で育てている子。遺伝子と歩き方の数だけ、js/kid-store.js から）。練習の途中でも入れる（いちばんよい歩き、なければいま試している歩き）
let KID = null; if (qs.get('kid')) { const k = loadKid(); if (k) KID = { name: k.name, genes: k.genes, v: k.v || k.trying, done: k.state?.done, getup: k.getup?.v ? decodeGetup(k.getup.v) : null }; }
if (KID) { document.body.classList.add('kid'); document.getElementById('tabs').hidden = false; if (KID.name) document.getElementById('needT').textContent = `${KID.name} と、もうすこし練習してからにしよう`; }
const KB = KID && kidBody(KID.genes);
const BODY = KB ? { build: (at, yaw = 0) => KB.build(R, world, at, height, yaw), drive: KB.drive, q: KB.decode(KID.v) } : { build: (at, yaw = 0) => buildHare(R, world, at, height, yaw), drive, q: decodeParams(v) };
const Q = BODY.q;

const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const BG = new THREE.Color(0xe9e2d4), scene = new THREE.Scene(); scene.background = BG.clone(); scene.fog = new THREE.Fog(BG.clone(), 4, 13);
const cam = new THREE.PerspectiveCamera(42, 1, 0.01, 60);
const hemi = new THREE.HemisphereLight(0xf6efe0, 0x6a6448, 1.0); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d6, 2.2); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 4; sun.shadow.bias = -0.0004;
Object.assign(sun.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5, near: 0.5, far: 20 }); scene.add(sun, sun.target);
const G = makeFeltGround(scene, { size: 16, n: 240, cx: 1.5, cz: 2.5 });

// 藪（目当て）: 3m 先から順に。着いたら次へ。羊毛の玉を寄せたもの
const BUSHES = [[3, 0.6], [4.5, 3.4], [1.5, 5.5], [-1.5, 3.5], [-0.5, 0.5]];
const ball = new THREE.SphereGeometry(1, 20, 14); ball.setAttribute('wet', new THREE.BufferAttribute(new Float32Array(ball.attributes.position.count), 1)); ball.setAttribute('fluff', new THREE.BufferAttribute(new Float32Array(ball.attributes.position.count).fill(1), 1));
const bushMat = (c, e = 0, shell = 0) => feltify(new THREE.MeshPhysicalMaterial({ color: c, roughness: 1, sheen: 0.8, sheenRoughness: 0.8, sheenColor: 0xdfe8b8, emissive: e ? 0x3a4a14 : 0, emissiveIntensity: e, alphaHash: true }) /* 透かすときは点描で（重なった殻の色が濁らない） */, { shell, len: 0.012, freq: 120, rest: false });
const bushes = BUSHES.map(([x, z], i) => {
  const g = new THREE.Group(); g.position.set(x, height(x, z), z); g.userData.fade = 1; g.userData.mats = { off: [], on: [] };
  for (const [k, sh] of [[0, 0], [1, 0.34], [2, 0.67], [3, 1]]) { g.userData.mats.off.push(bushMat(0x4a5c36, 0, sh)); g.userData.mats.on.push(bushMat(0x6f8a46, 0.45, sh)); }
  for (let k = 0; k < 7; k++) {
    const a = k * 2.4 + i, r = 0.12 + (k % 3) * 0.05, pos = [Math.cos(a) * 0.15 * (k % 4) / 2, r * 0.8 + (k % 2) * 0.08, Math.sin(a) * 0.15 * (k % 4) / 2];
    for (let s = 0; s < 4; s++) { const m = new THREE.Mesh(ball, g.userData.mats.off[s]); m.scale.setScalar(r); m.position.set(...pos); m.castShadow = s === 0; m.receiveShadow = true; m.userData.s = s; g.add(m); }
  }
  scene.add(g); return g;
});
let goal = 0; const setGoal = i => bushes.forEach((b, k) => b.children.forEach(m => (m.material = b.userData.mats[k === i ? 'on' : 'off'][m.userData.s])));
setGoal(goal);

// 体（物理）と皮（フェルト）
const world = makeField(R); let H = BODY.build([0, 0, 0]), D = makeDirt(H);
const FB = KB ? makeFeltBody(scene, H, kidShapes(H), { furColor: lookFur(KID.genes.look, H), face: lookFace(KID.genes.look, H.plan, HARE_FACE) })
  : makeFeltBody(scene, H, hareShapes(H), { furColor: (part, p, n) => hareFurColor(part, p, n, H), headOff: HEAD_OFF, bends: hareBends(H) });
// 声の子の泥は、育てるへ持って帰る（泥の点だけ。乾いて落ちる・水浴びは育てるで）
if (KID) { FB.mud.blobs = loadKid()?.mud || []; const keepMud = () => { const k = loadKid(); if (k) { k.mud = FB.mud.blobs; saveKid(k); } }; setInterval(keepMud, 5000); addEventListener('pagehide', keepMud); }
// 転んだら、少し待ってその場で起き直す（体を作り直す。向きは転ぶ前のまま、場所は地面のはしより内側。泥とぬれは引きつぐ）
function respawn() {
  const P = pose(H); for (const p of Object.values(H.parts)) if (world.getRigidBody(p.body.handle)) world.removeRigidBody(p.body);
  const L = SIZE / 2 - 1.5, keep = D; H = BODY.build([Math.max(-L, Math.min(L, P.x)), 0, Math.max(-L, Math.min(L, P.z))], P.yaw); D = makeDirt(H);
  for (const k in D) if (keep[k]) Object.assign(D[k], { mud: keep[k].mud, wet: keep[k].wet, dry: keep[k].dry });
  FB.rebind(H, P.yaw); t = 0; gNow = 0; gu = null;
}

// 足あと: ぬかるみでは深く濃く、泥のついた足は草の上にも泥の跡を残す
const prints = [], printGeo = new THREE.CircleGeometry(1, 14);
const printMats = [0.25, 0.4, 0.55, 0.7].map(o => new THREE.MeshBasicMaterial({ color: 0x3c3226, transparent: true, opacity: o, depthWrite: false }));
function addPrint(f, P) {
  const p = f.body.translation(), m0 = mud(p.x, p.z, rainOn ? 1 : 0), fm = D[f.name] ? D[f.name].mud * (1 - D[f.name].dry) : 0, k = Math.max(m0, fm * 0.8);
  if (k < 0.05 && !f.hind) return; // 草の上の乾いた前足は跡が見えない
  const m = new THREE.Mesh(printGeo, printMats[Math.min(3, Math.floor(k * 4))]);
  m.rotation.x = -Math.PI / 2; m.rotation.z = -P.yaw; m.scale.set(f.hind ? 0.035 : 0.014, 0.012, 1);
  m.position.set(p.x - (f.hind ? 0.04 * P.fx : 0), height(p.x, p.z) + 0.004, p.z - (f.hind ? 0.04 * P.fz : 0)); scene.add(m); prints.push(m);
  if (prints.length > 400) scene.remove(prints.shift());
}

// 雨
let rainOn = false;
const RAIN = 2500, rg = new THREE.BufferGeometry(), rp = new Float32Array(RAIN * 6); rg.setAttribute('position', new THREE.BufferAttribute(rp, 3));
const rain = new THREE.LineSegments(rg, new THREE.LineBasicMaterial({ color: 0xbfc8d0, transparent: true, opacity: 0.25 })); rain.frustumCulled = false; rain.visible = false; scene.add(rain);
const drops = Array.from({ length: RAIN }, () => [Math.random() * 5 - 2.5, Math.random() * 3, Math.random() * 5 - 2.5]);
function setRain(on) {
  rainOn = on; document.getElementById('rain').classList.toggle('on', on); rain.visible = on; G.setWet(on ? 1 : 0);
  const bg = BG.clone().lerp(new THREE.Color(0x8d939a), on ? 0.4 : 0); scene.background.copy(bg); scene.fog.color.copy(bg); sun.intensity = on ? 0.7 : 2.2; hemi.intensity = on ? 0.8 : 1.0;
}
document.getElementById('rain').addEventListener('pointerdown', e => { e.stopPropagation(); setRain(!rainOn); });

// 入力: さわった所（地面の点）へ向かう。キーは画面の向き（カメラから見た前後左右）
// 肩ごし・目線では、マウス（クリックでつかむ・Esc ではなす）かドラッグで見回す。上下ははじめ「逆」（メモリ: カメラの上下は逆）
let target = null, keys = new Set(), pointerDown = null;
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const look = () => camMode === 'tps' || camMode === 'fps';
function pick(e) { ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(ndc, cam); const h = ray.intersectObject(G.ground)[0]; if (h) { target = h.point.clone(); markInput(); } }
// dx＝右へ動かすと右を向く。dy＝上へ動かすと、ふつうは上を向き、逆なら下を向く
function turnView(dx, dy, k = 0.0035) { camYaw += dx * k; camPitch = Math.max(-0.9, Math.min(1.2, camPitch + dy * k * (invY ? 1 : -1))); }
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0) return; // 左ボタン・指だけ
  if (look() && e.pointerType === 'mouse') { if (document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock?.(); return; }
  pointerDown = { x: e.clientX, y: e.clientY, moved: false };
  if (!look()) pick(e);
});
addEventListener('pointermove', e => {
  if (document.pointerLockElement === renderer.domElement) { turnView(e.movementX, e.movementY); return; }
  if (!pointerDown) return;
  if (look()) { const dx = e.clientX - pointerDown.x, dy = e.clientY - pointerDown.y; if (Math.hypot(dx, dy) > 8) pointerDown.moved = true; if (pointerDown.moved) { turnView(dx, dy, 0.006); pointerDown.x = e.clientX; pointerDown.y = e.clientY; } }
  else pick(e);
});
addEventListener('pointerup', e => { if (pointerDown && look() && !pointerDown.moved) pick(e); pointerDown = null; }); // 肩ごし・目線でも、指でさわった所へは行ける
renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); camDist = Math.max(0.5, Math.min(3, camDist * (e.deltaY > 0 ? 1.1 : 0.9))); }, { passive: false });
const MODES = ['follow', 'tps', 'fps', 'top'];
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); if (k === 'v') { if (!e.repeat) setCam(MODES[(MODES.indexOf(camMode) + 1) % MODES.length]); return; }
  keys.add(k); if (e.key.startsWith('Arrow') || k === ' ') e.preventDefault(); target = null; markInput();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
// 右クリックのメニューは出さない（メニューが開くとキーをはなしたことが届かず、押しっぱなしになる）。窓を離れたとき・マウスをはなしたときも、押しているキーを全部はなす
addEventListener('contextmenu', e => e.preventDefault());
const releaseAll = () => { keys.clear(); pointerDown = null; };
addEventListener('blur', releaseAll); document.addEventListener('visibilitychange', releaseAll); document.addEventListener('pointerlockchange', releaseAll);
// 入力から体が曲がり始めるまでの遅れを測る
let inputAt = null, lags = [];
function markInput() { if (inputAt == null) inputAt = { t: clock, yaw: pose(H).yaw }; }

const wrap = a => a - Math.round(a / (Math.PI * 2)) * Math.PI * 2;
// 遊ぶ人が渡すもの → 行きたい向き（世界の角度）と、行きたいか（0/1）
function wish(P) {
  const k = d => keys.has(d);
  const fx = (k('arrowup') || k('w') ? 1 : 0) - (k('arrowdown') || k('s') ? 1 : 0), sx = (k('arrowright') || k('d') ? 1 : 0) - (k('arrowleft') || k('a') ? 1 : 0);
  if (fx || sx) { const cy = camYaw; return { yaw: Math.atan2(Math.sin(cy) * fx + Math.cos(cy) * sx, Math.cos(cy) * fx - Math.sin(cy) * sx), go: 1 }; }
  if (target) { const dx = target.x - P.x, dz = target.z - P.z; if (Math.hypot(dx, dz) < 0.25) { target = null; return { go: 0 }; } return { yaw: Math.atan2(dz, dx), go: 1 }; }
  return { go: 0 };
}

let gu = null, t = 0, clock = 0, gNow = 0, turnNow = 0, falls = 0, fallT = 0, legT = 0, legs = [], fallAt = [], needT = 0;
function stepFrame(dt) {
  const n = Math.round(dt * 240);
  for (let k = 0; k < n; k++) {
    if (k % 4 === 0) {
      const P = pose(H), w = wish(P);
      // 速さはゆっくり上げ下げ、向きは角度の差に比例（+ で左＝yaw が増える向き）
      gNow += Math.max(-3 / 60, Math.min(3 / 60, (w.go ? 1 : 0) - gNow));
      turnNow = w.go ? Math.max(-1, Math.min(1, wrap(w.yaw - P.yaw) * 1.5)) : 0;
      if (inputAt && Math.abs(wrap(P.yaw - inputAt.yaw)) > 0.15) { lags.push(clock - inputAt.t); inputAt = null; }
      if (inputAt && clock - inputAt.t > 3) inputAt = null;
      // 藪に着いたか
      const b = BUSHES[goal]; if (Math.hypot(P.x - b[0], P.z - b[1]) < 0.4) { legs.push(+(clock - legT).toFixed(1)); show(`藪に着いた（${(clock - legT).toFixed(1)} 秒）`); goal = (goal + 1) % BUSHES.length; setGoal(goal); legT = clock; }
      for (const f of H.feet) { const c = contactPoint(f), d = !!c; if (d && !f.down) addPrint(f, P); f.down = d; }
      FB.mud.hit(stepDirt(D, H, 4 / 240, rainOn ? 1 : 0)); // ふれた所を中心に泥の点
      // 転んだら: 起き上がりを覚えた子は、少し待って自分で起きる（4 秒で起きられなければ起き直す）。覚えていない子は、すぐ起き直す（文字や音で失敗を見せない。GAME.md 9.7）
      if (gu) { if (gu.stopAt == null && gu.t > 0.2 && P.up > GETUP_UP) gu.stopAt = gu.t; if (gu.t > 4) { gu = null; respawn(); fallT = 0; } }
      else if (fallT) { if (KID?.getup && clock - fallT > 0.6) gu = { t: 0, d: Math.sign(P.roll) || 1, stopAt: null }; else if (!KID?.getup && clock - fallT > 0.8) { respawn(); fallT = 0; } }
      else if (P.up < 0.35 || P.y - height(P.x, P.z) < (H.fallH ?? 0.05) || (H.maxPitch && Math.abs(P.pitch) > H.maxPitch)) { falls++; fallT = clock; fallAt.push(clock); }
      // 声の子が 20 秒に 3 回より多く転ぶなら「もうすこし練習してから」と伝えて、育てるへもどる道を出す（責める文にしない）
      if (KID) { while (fallAt.length && clock - fallAt[0] > 20) fallAt.shift(); if (fallAt.length >= 3) needT = clock; document.getElementById('need').hidden = !(needT && clock - needT < 12); }
    }
    if (gu) { gu.t += 1 / 240; if (driveGetup(H, KID.getup, gu.t, gu.d, gu.stopAt)) { gu = null; fallT = 0; t = 0; } } // 起き上がる
    else BODY.drive(H, Q, t, fallT ? 0 : gNow, turnNow);
    world.step(); t += 1 / 240; clock += 1 / 240;
  }
}
let msgT = 0; function show(s) { const el = document.getElementById('msg'); el.textContent = s; el.style.opacity = 1; clearTimeout(msgT); msgT = setTimeout(() => (el.style.opacity = 0), 1400); }
function stepRain(dt, P) {
  if (!rainOn) return;
  for (let i = 0; i < RAIN; i++) { const d = drops[i]; d[1] -= dt * 6; if (d[1] < -0.2) { d[0] = Math.random() * 5 - 2.5; d[2] = Math.random() * 5 - 2.5; d[1] = 2.5 + Math.random(); }
    const x = P.x + d[0], z = P.z + d[2], y = height(x, z) + d[1]; rp.set([x, y, z, x + 0.01, y + 0.07, z], i * 6); }
  rg.attributes.position.needsUpdate = true;
}

// カメラ: 追う（うしろ上から向きにゆっくりついていく）・肩ごし（マウスで回す TPS）・目線（ノウサギの目の高さの FPS）・見下ろし（ジオラマを斜め上から）。V で切りかえ
// 揺れをおさえる: 跳ぶたびの上下と、着地のがたつきを、カメラが見る点でならす（はじめは「おさえる」。酔いやすい人のため）
const DIO = makeDiorama(renderer, scene, cam);
let camYaw = 0, camPitch = 0.45, camDist = 1.3, camMode = 'follow', invY = true, steady = true, frame = 0;
