<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>サムネイル撮影用</title>
<style>html,body{margin:0;overflow:hidden;background:#000}iframe{display:block;width:640px;height:360px;border:0}</style>
</head>
<body>
<!--
  あそびラボのサムネイルを撮るためのページ（ローカル用）。tools/make-thumbs.ps1（静止画）と tools/make-motion-thumbs.ps1（動画）が
  ヘッドレスの Chrome で開いて撮る。?game=<フォルダ名> のゲームを <game>/?thumb で 640×360 の画面に開く（撮る道具が2倍の細かさにする）（各ゲームは ?thumb で見せたい場面を作る）。
  &motion=1 のときは、そのあとゲームの時計を止めて、撮る側が __motionStep(ms) で1コマずつ進める。
  ?thumb で止まる作りのゲームは、下の MOTION で同じ場面から動きはじめさせる（ゲームのコードは変えず、物理やルールもそのまま）。
-->
<iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search);
const game = q.get('game');
const wait = ms => new Promise(r => setTimeout(r, ms));
const run = (w, js) => w.eval(js);   // ゲームの外から、ゲームの let の変数・関数にさわる（どれも普通の <script>）

// 静止画・動画のどちらでも、?thumb の場面のあとにすること（w = ゲームの window）
const SETUP = {
  // ?thumb（ティラノ1匹）の作りのまま、ゆっくりのティラノと、脚が高速で回るコンプソグナトゥスの2レーンに（2026-10-17 ユーザー）。
  // main.js の ?thumb の one() と同じ手順。&dino=<種>,<種>&t=<秒> で試せる
  'dino-race': w => {
    const ids = (q.get('dino') || 'trex,compy').split(','), t = +(q.get('t') || 2.6);
    run(w, `{ const st = ${JSON.stringify(ids)}.map(id => starter(SPECIES.find(s => s.id === id)));
      startView(st.map(x => x.g), st.map(x => x.name), { mode: 'idle-run' });
      for (let i = 0; i < ${t} / DT; i++) stepRace(VIEW.R);
      updateCamera(true);
      drawScene($('view'), VIEW.R, VIEW.cams, { title: false, labels: VIEW.labels, progressH: 0 }); }`);
  },
  // ?thumb は「時を止める」にしてあり、止まっているときの色あせ（body.paused）がかかる。サムネイルでは外す
  'edge-falls': async w => { w.document.body.classList.remove('paused'); await wait(800); },
  // ?thumb の「鳥がもう触角の目の前」の場面は、動かすと 0.3 秒で面クリアになる。2026-10-17 に場面を選び直した:
  // 1面の遊びのとちゅう（31 秒目）。遊ぶ人がカタツムリをまん中の日なたに引っぱりとめ（G.pointer）、上を鳥がまわっている。
  // 動画では、とちゅうで「触角をふくらませる」を押す（MOTION）→ 鳥が気づいて降りてくる。食べられる前に 4 秒が終わる
  'parasite-pilot': w => {
    run(w, `Object.assign(G, { running: true, paused: false, ability: false, gauge: 100, t: 31 });
      Object.assign(G.host, { x: 575, y: 395, a: -1.2, m: 100, shell: 0 });
      Object.assign(G.bird, { x: 680, y: 229, st: 'circle', spot: 0, ph: 0.6 });
      Object.assign(G.beetle, { x: 250, y: 470, a: 0.3 });
      Object.assign(G.pointer, { on: true, x: 560, y: 380 });
      last = performance.now();`);
  },
  // ぺらぺら世界（2026-11-06 作り直し。ユーザー「サムネがチープ」「2D世界のキーウィをマスコット的に」）:
  // パラパラ漫画の構図。1秒ずつのページを扇のように奥（未来）へ重ね、手前のページに大きなキーウィ。
  // 奥のページほど1秒先のキーウィで、板の橋が出ているあいだに崖をわたっていくのが、ページをまたいで見える。上に多面体の旅人。
  // 絵はゲームの描き方（look の drawTerrain・drawSection・drawWalker）と、ゲームの計算した歴史のまま（図版 I・板 x0=17・3秒）。
  // キーウィだけ、世界より 1.6 倍大きく描く（マスコット）
  'flat-history': async w => {
    const main = [...w.document.scripts].find(s => /main\.js/.test(s.src));
    const src = await (await fetch(main.src)).text();
    const mod = name => w.eval(`import('${new URL(src.match(new RegExp(`'\./(${name}\.js[^']*)'`))[1], main.src).href}')`);   // main.js と同じ URL で読む（同じモジュールになる）
    const [{ look }, { sectionsAt }] = await Promise.all([mod('look/index'), mod('sim')]);
    const d = w.document, st = w.__fh.st, L = w.__fh.L, lk = look();
    const hist = w.__fh.simulate(L, st.pieces);
    // ページ1枚の絵（切り抜き: 横 12.6 マスから 9 マス。地面の線をページの上から 46% に置き、下は地層の断面）。どのページも同じ大きさで描いて、置くときに縮める
    const K = +(q.get('k') || 1);   // 絵の細かさ（YouTube のサムネイルの元にするときは 2 で 2560×1440）
    const PW = 760, PH = 400, CX = 12.6, S = PW * K / 9, TOP = 4 + (PH * 0.46) / (PW / 9);
    const mk = () => { const c = d.createElement('canvas'); c.width = PW * K; c.height = PH * K; return c; };
    const terr = mk(), tg = terr.getContext('2d');
    tg.translate(-CX * S, -(L.H - TOP) * S);
    const gr = tg.createLinearGradient(0, 0, 0, L.H * S); gr.addColorStop(0, lk.paper[0]); gr.addColorStop(1, lk.paper[1]);
    tg.fillStyle = gr; tg.fillRect(0, 0, L.W * S, L.H * S);
    lk.drawTerrain(tg, L, S);
    const page = mk(), pg = page.getContext('2d');
    const drawPage = t => {
      pg.setTransform(1, 0, 0, 1, 0, 0); pg.drawImage(terr, 0, 0);
      pg.translate(-CX * S, -(L.H - TOP) * S);
      for (const s of sectionsAt(st.pieces, t)) lk.drawSection(pg, L, s, S, '#c98a4a');
      const f = hist.frames[Math.max(0, Math.min(hist.frames.length - 1, Math.round(t / 0.1)))];
      if (f.st !== 'dead') lk.drawWalker(pg, L, f, S, (S / 20) * 1.6);
      // 秒の札（ページの左上。銅版画の図版の番号のように）
      pg.setTransform(K, 0, 0, K, 0, 0);
      pg.font = 'italic 600 30px "Cormorant Garamond", Georgia, serif'; pg.fillStyle = 'rgba(59,42,28,.62)';
      pg.fillText(`${Math.floor(t)} s`, 22, 44);
    };
    // 画面いっぱいの絵（3D はかくす）
    const cv = d.createElement('canvas'); cv.width = 1280 * K; cv.height = 720 * K;
    cv.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;z-index:50';
    d.body.append(cv);
    const g = cv.getContext('2d');
    // 多面体の旅人（2D の絵で。ゲームの主人公と同じ、青緑の宝石と金の菱形）
    const gem = (x, y, r, tm) => {
      g.save(); g.translate(x, y + Math.sin(tm * 2.2) * 6);
      const halo = g.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 2.6); halo.addColorStop(0, 'rgba(120,230,200,.30)'); halo.addColorStop(1, 'rgba(120,230,200,0)');
      g.fillStyle = halo; g.beginPath(); g.arc(0, 0, r * 2.6, 0, 7); g.fill();
      const P = [...Array(6)].map((_, i) => [Math.cos(i * Math.PI / 3 + Math.PI / 6) * r, Math.sin(i * Math.PI / 3 + Math.PI / 6) * r]);
      const C = [0, -r * 0.08], tones = ['#5fd3b1', '#2aa585', '#167a63', '#0d5848', '#1b8b70', '#3fbf9c'];
      for (let i = 0; i < 6; i++) { const a = P[i], b = P[(i + 1) % 6]; g.fillStyle = tones[i]; g.beginPath(); g.moveTo(C[0], C[1]); g.lineTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.closePath(); g.fill(); }
      g.fillStyle = 'rgba(220,255,240,.55)'; g.beginPath(); g.moveTo(C[0], C[1]); g.lineTo(P[4][0] * 0.55, P[4][1] * 0.55); g.lineTo(P[5][0] * 0.55, P[5][1] * 0.55); g.closePath(); g.fill();
      g.strokeStyle = '#0a3a30'; g.lineWidth = 2.5; g.beginPath(); P.forEach((p, i) => (i ? g.lineTo(...p) : g.moveTo(...p))); g.closePath(); g.stroke();
      g.strokeStyle = 'rgba(10,58,48,.55)'; g.lineWidth = 1.4; for (const p of P) { g.beginPath(); g.moveTo(C[0], C[1]); g.lineTo(...p); g.stroke(); }
      // 頭の上の金の菱形
      const gy = -r * 1.55, gs = r * 0.42;
      g.fillStyle = '#f1c75a'; g.beginPath(); g.moveTo(0, gy - gs); g.lineTo(gs * 0.75, gy); g.lineTo(0, gy + gs); g.lineTo(-gs * 0.75, gy); g.closePath(); g.fill();
      g.fillStyle = '#b8862c'; g.beginPath(); g.moveTo(0, gy - gs); g.lineTo(gs * 0.75, gy); g.lineTo(0, gy); g.closePath(); g.fill();
      g.strokeStyle = '#5a3d12'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(0, gy - gs); g.lineTo(gs * 0.75, gy); g.lineTo(0, gy + gs); g.lineTo(-gs * 0.75, gy); g.closePath(); g.stroke();
      g.restore();
    };
    const N = 4;
    w.__thumbDraw = (t, tm) => {
      g.setTransform(K, 0, 0, K, 0, 0);
      const bg = g.createRadialGradient(560, 300, 60, 640, 360, 860); bg.addColorStop(0, '#1f5249'); bg.addColorStop(0.55, '#123a33'); bg.addColorStop(1, '#071c18');
      g.fillStyle = bg; g.fillRect(0, 0, 1280, 720);
      // 時間の軸（金の細い線と目盛り。手前＝いま、奥＝未来）
      g.strokeStyle = 'rgba(230,196,110,.35)'; g.lineWidth = 2; g.beginPath(); g.moveTo(150, 700); g.lineTo(1120, 60); g.stroke();
      for (let i = -2; i <= 12; i++) { const u = i / 10, x = 150 + 970 * u, y = 700 - 640 * u; g.beginPath(); g.moveTo(x - 9, y - 6); g.lineTo(x + 9, y + 6); g.stroke(); }
      // 奥のページから描く
      for (let i = N - 1; i >= 0; i--) {
        const sc = 0.8 - 0.065 * i, x = 214 + 162 * i, y = 384 - 128 * i, pw = PW * sc, ph = PH * sc;
        drawPage(t + i);
        g.save(); g.translate(x, y); g.rotate(-0.05 + 0.012 * i);
        g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 34 * sc; g.shadowOffsetY = 12 * sc;
        g.fillStyle = '#f4ead2'; g.fillRect(-10 * sc, -10 * sc, pw + 20 * sc, ph + 20 * sc);
        g.shadowColor = 'transparent';
        g.drawImage(page, 0, 0, pw, ph);
        g.strokeStyle = '#3b2a1c'; g.lineWidth = 2 * sc; g.strokeRect(0, 0, pw, ph);
        g.strokeStyle = 'rgba(59,42,28,.45)'; g.lineWidth = 1; g.strokeRect(-6 * sc, -6 * sc, pw + 12 * sc, ph + 12 * sc);
        if (i) { g.fillStyle = `rgba(14,44,38,${0.1 * i})`; g.fillRect(-10 * sc, -10 * sc, pw + 20 * sc, ph + 20 * sc); }   // 奥ほど深い青緑にしずむ
        g.restore();
      }
      gem(150, 170, 58, tm);
    };
    w.__thumbDraw(8.0, 0);
  },
};

// ゲームごとの、?thumb の場面からの動かし方（w = ゲームの window。時計を止めたあとに呼ぶ）。関数を返すと、撮るコマごとに（コマ番号を渡して）呼ぶ
const MOTION = {
  // ?thumb は1枚描いて止まる。練習場の計算（stepView）を進めながら、?thumb と同じ描き方（進みの棒なし）で描きつづける。2匹がそのまま走る
  'dino-race': w => {
    run(w, `lastT = performance.now();
      (function thumbLoop(now) {
        const dt = (now - lastT) / 1000; lastT = now;
        stepView(dt); updateCamera();
        drawScene($('view'), VIEW.R, VIEW.cams, { title: false, labels: VIEW.labels, progressH: 0, ghosts: VIEW.ghosts, fx: VIEW.fx, clock: VIEW.clock });
        requestAnimationFrame(thumbLoop);
      })(performance.now());`);
  },
  // ?thumb は「時を止める」にしてある。×4 の速さにする（ふつうの速さだと 4 秒ではほとんど動かない。×4 はゲームの速さのボタンの1つ）
  'edge-falls': w => { w.__ef.setSpeed(4); },
  // ぺらぺら世界: パラパラ漫画のページの時刻を、4 秒で 8.0 秒目から 10.7 秒目へ（ページがめくれていくように、キーウィが崖をわたる）
  'flat-history': w => k => w.__thumbDraw(8.0 + k / 22, k / 15),
  // 2.8 秒目に「触角をふくらませる」を押す（遊ぶ人の操作そのまま）
  'parasite-pilot': w => k => { if (k === 42) run(w, 'G.ability = true'); },
  // ?thumb は rAF を回さない。同じ世界のまま時間を進める（thumbMode のままなので知らせは出ない）
  'heaven-spheres': w => { run(w, 'lastT = performance.now(); requestAnimationFrame(frame)'); },
  // ?thumb は第1夜の 10 秒目で止めてある（S.phase = 'thumb'）。夜にもどすと虫が動きだす。はじめてのてびきは出さない
  'resistance': w => { run(w, "S.phase = 'night'; S.paused = false; S.bannerT = 0; TIPS.forEach((t, i) => tipsShown.add(i)); lastT = performance.now()"); },
};

// ゲームの時計（requestAnimationFrame と performance.now）を止め、撮る側が __motionStep(ms) で1コマずつ進める。
// 重いゲームでも撮るのが遅いだけで、動画の中の速さは本物と同じになる（まなびラボの _dev/tools/thumb.html と同じ）
async function freezeClock(w) {
  const qu = [];
  let now = w.performance.now();
  w.requestAnimationFrame = cb => { qu.push(cb); return qu.length; };
  w.performance.now = () => now;
  await wait(200);   // 本物の rAF に残っている分が1回まわって、止めた rAF に入るのを待つ
  let k = 0, onFrame = null;
  window.__motionStep = async ms => {
    if (onFrame) { try { onFrame(k); } catch (e) { console.error(e); } }
    k++;
    const sub = Math.max(1, Math.round(ms / (1000 / 60)));   // 1/60 秒ずつ（dt に上限のあるゲームのため）
    for (let i = 0; i < sub; i++) { now += ms / sub; qu.splice(0).forEach(cb => { try { cb(now); } catch (e) { console.error(e); } }); }
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));   // 描いた絵が画面に出るのを待つ
  };
  return fn => { onFrame = fn; };
}

const f = document.getElementById('f');
f.onload = async () => {
  const w = f.contentWindow;
  for (let i = 0; i < 100 && w.document.readyState !== 'complete'; i++) await wait(100);
  await wait(+(q.get('wait') || 4000));   // フォント・3D の読みこみと、?thumb の場面づくり
  if (SETUP[game]) { try { await SETUP[game](w); } catch (e) { console.error(e); } }
  // 静止画も時計を止めて1コマだけ進めて撮る（動画の最初の絵とそろう）
  const setOnFrame = await freezeClock(w);
  if (q.get('motion')) {
    if (MOTION[game]) { try { const fn = await MOTION[game](w); if (typeof fn === 'function') setOnFrame(fn); } catch (e) { console.error(e); } }
  } else await window.__motionStep(1000 / 15);
  document.title = 'ready';
};
f.src = '../' + game + '/?thumb';
</script>
</body>
</html>
