<title>花の小川（試作）</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/no-quirks.css"><script src="../assets/no-quirks.js" defer></script>
<link rel="stylesheet" href="css/game.css?v=4">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"></div>
<div class="tilt top"></div><div class="tilt bot"></div><div class="vig"></div>

<div id="hud" hidden>
  <div id="rareChip" aria-label="咲かせためずらしい花"><i></i><span id="rare"></span></div>
  <button id="pauseBtn" aria-label="止める">II</button>
</div>
<p id="hint" hidden></p>

<div id="title" class="panel">
  <div class="sheet">
    <h1>花の小川</h1>
    <p class="lead">しずくを流して、花畑を咲かせよう</p>
    <canvas id="garden"></canvas>
    <p id="gardenCount" class="small"></p>
    <button id="startBtn" class="btn">はじめる</button>
    <p class="small keys">しずくをつまむと、指についてくる<br>上へ動かすと急ぎ、下へ動かすと戻る。勢いよくはなすと放れる<br>キー: ←→ 岸へ　↑ 急ぐ　↓ 戻る　Esc 止める</p>
    <p class="small ver"><span id="ver"></span>　試作</p>
    <p class="small src">おもな出どころ: 空の光 <a href="https://polyhaven.com/" target="_blank" rel="noopener">Poly Haven</a>（CC0）　3D <a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a>（MIT）　石と根の形 <a href="https://github.com/VAST-AI-Research/TripoSG" target="_blank" rel="noopener">TripoSG</a>（MIT）</p>
  </div>
</div>

<div id="menu" class="panel" hidden>
  <div class="sheet">
    <h2>ひと休み</h2>
    <button id="resumeBtn" class="btn">つづける</button>
    <button id="soundBtn" class="btn sub">音: あり</button>
    <button id="propsBtn" class="btn sub">岸の石と根もと: あり</button>
    <button id="titleBtn" class="btn sub">タイトルへ</button>
  </div>
</div>

<div id="result" class="panel" hidden>
  <div class="sheet">
    <h2 id="resName"></h2>
    <p id="resRare" class="lead"></p>
    <p class="small">庭に植えました</p>
    <button id="againBtn" class="btn">ちがう小川へ</button>
    <button id="sameBtn" class="btn sub">同じ小川でもう一度</button>
    <button id="resTitleBtn" class="btn sub">タイトルへ</button>
  </div>
</div>
<script type="module" src="js/game.js?v=14"></script>
</body>
</html>
