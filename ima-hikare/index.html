<title>いま光れ</title>
<meta name="description" content="回路をつないで、ブラウン管のビームが来た瞬間に光らせる。1972年のテレビのテニスを、自分の回路で育てるゲームの試作。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">

<body>
<div class="top"><span class="title">いま光れ</span><span class="stage" id="stage"></span><span class="line" id="line"></span><span class="ver">ver. 0.1</span></div>
<div class="rig">
  <div class="tubebox"><div class="bezel" id="bezel"><canvas id="tube"></canvas>
    <span class="screw" style="left:1.6%;top:2%"></span><span class="screw" style="right:1.6%;top:2%"></span><span class="screw" style="left:1.6%;bottom:2%"></span><span class="screw" style="right:1.6%;bottom:2%"></span>
    <div class="ruler h" id="rulerH"></div><div class="ruler v" id="rulerV"></div></div></div>
  <div class="boardbox" id="boardbox"><canvas id="board"></canvas>
    <button class="tool" id="cut">線をはずす</button>
    <button class="tool" id="answer">答えを見る</button>
  </div>
  <div class="ctl">
    <button class="tool" id="undo" disabled aria-label="ひとつ戻す">↶ 戻す</button>
    <div class="speed" id="speed"></div>
    <button class="next" id="next" hidden>次へ</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="cheer" id="cheer"></div>
<canvas id="over"></canvas>
<script type="module" src="js/game.js?v=2"></script>
</body>
