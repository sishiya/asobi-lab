<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あそびラボ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23d9480f'/><rect x='10' y='22' width='44' height='24' rx='12' fill='%23fff'/><path d='M22 28v12M16 34h12' stroke='%23d9480f' stroke-width='4' stroke-linecap='round'/><circle cx='41' cy='31' r='3' fill='%23d9480f'/><circle cx='47' cy='37' r='3' fill='%23d9480f'/></svg>">
<meta name="description" content="ブラウザで遊べる小さなゲームのシリーズ。Claude と一緒に作っています。">
<style>
:root{--bg:#fbf6ef;--ink:#1f1a17;--muted:#6b625a;--line:#e3d9cc;--card:#fff;--accent:#d9480f;--accent-ink:#fff;--thumb:#eadfd1;--field:#fff;
  --c-action:#c2410c;--c-puzzle:#2f7a8c;--c-sim:#5f8a3a;--c-party:#a3489b;--new:#d9480f;--new-ink:#fff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#14110f;--ink:#f1ebe4;--muted:#a59b91;--line:#332c26;--card:#1d1916;--accent:#ff8a4c;--accent-ink:#14110f;--thumb:#332c26;--field:#1d1916;
  --c-action:#f0a072;--c-puzzle:#7fc0cf;--c-sim:#a6c98a;--c-party:#d79ad0;--new:#ff8a4c;--new-ink:#1a0e05}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;line-height:1.75}
p,.cat,.status{word-break:auto-phrase;text-wrap:pretty}
main{max-width:1000px;margin:0 auto;padding:48px 16px 64px}
a{color:var(--accent)}

/* 見出し: ロゴ（ファビコンと同じ絵）＋名前 */
.title{display:flex;align-items:center;gap:14px;margin:0 0 8px}
.title svg{width:48px;height:48px;flex:none}
h1{margin:0;font-size:32px;line-height:1.3;letter-spacing:.02em}
.lead{color:var(--muted);margin:0 0 24px;max-width:720px}

/* 操作欄: ジャンル（左）と並び順（右）。ゲームが2本以上になったら出す */
.tools{display:flex;flex-direction:column;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);background:var(--bg)}
@media (min-width:720px){.tools{position:sticky;top:0;z-index:5}}
.sort{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--field)}
.seg button{font:inherit;font-size:13px;color:var(--ink);background:none;border:0;padding:6px 14px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip[aria-pressed=true] .n{color:inherit;opacity:.75}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 16px}
.status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;margin:0}

/* 一覧 */
h2{font-size:16px;font-weight:700;margin:48px 0 16px;display:flex;align-items:center;gap:8px}
h2 .dot{width:10px;height:10px}
h2 .n{font-size:13px;font-weight:400;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:20px}
h2+.grid{margin-top:0}
#list>h2:first-child{margin-top:20px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .15s,border-color .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card:hover .thumb{filter:brightness(1.08)}
.pic{position:relative}
.thumb{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:var(--thumb)}
.badge{position:absolute;top:10px;left:10px;font-size:12px;font-weight:700;line-height:1;padding:5px 8px;border-radius:6px;background:var(--new);color:var(--new-ink)}
.badge.upd{font-weight:500;background:rgba(20,17,15,.62);color:#fff}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.cat{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.card a.open{color:var(--accent);font-size:18px;font-weight:700;line-height:1.45;text-decoration:none}
.card a.open::after{content:"";position:absolute;inset:0}
.card a.open:focus-visible{outline:none}
.card:has(a.open:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.card p{margin:6px 0 16px;color:var(--muted);font-size:14px;line-height:1.7;flex:1}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.dates{font-variant-numeric:tabular-nums}
.dates .fresh{color:var(--ink);font-weight:700}
.card a.ver{position:relative;z-index:1;color:var(--muted)}

/* まだゲームがないとき */
.empty{margin-top:24px;border:2px dashed var(--line);border-radius:14px;padding:40px 24px;text-align:center;color:var(--muted)}
.empty .big{font-size:20px;font-weight:700;color:var(--ink);margin:12px 0 4px}
.empty p{margin:0}
.empty svg{width:72px;height:72px;opacity:.9}
.blink{animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}.card{transition:none}.card:hover{transform:none}}

.note{font-size:13px;color:var(--muted);margin:64px 0 0;padding-top:24px;border-top:1px solid var(--line)}
.c-action{--c:var(--c-action)}.c-puzzle{--c:var(--c-puzzle)}.c-sim{--c:var(--c-sim)}.c-party{--c:var(--c-party)}
@media (max-width:719px){main{padding-top:32px}}

/* スマホ: 一覧は横長のリスト、ジャンルは横にスクロールする1行、押す所は高さ44px */
@media (max-width:639px){
  .title svg{width:40px;height:40px}
  h1{font-size:28px}
  .lead{font-size:14px;margin-bottom:16px}
  .tools{gap:12px;padding:12px 0}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px;
    -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent)}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;min-height:44px;padding:4px 14px;font-size:15px}
  .seg button{min-height:44px;padding:6px 16px;font-size:14px}
  h2{margin:32px 0 12px}
  #list>h2:first-child{margin-top:16px}
  .grid,h2+.grid{grid-template-columns:1fr;gap:12px;margin-top:16px}
  h2+.grid{margin-top:0}
  .card{flex-direction:row;border-radius:10px}
  .card:hover{transform:none}
  .pic{flex:none;width:112px;align-self:flex-start;margin:10px 0 10px 10px}
  .thumb{aspect-ratio:4/3;border-radius:6px}
  .badge{top:4px;left:4px;font-size:11px;padding:3px 6px}
  .body{padding:10px 12px;min-width:0}
  .cat{margin-bottom:0}
  .card a.open{font-size:16px}
  .card p{font-size:13px;line-height:1.6;margin:2px 0 6px}
  .foot{padding-top:0;border-top:0;font-size:11px}
  .empty{padding:32px 16px}
}
</style>
</head>
<body>
<main>
  <div class="title">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#d9480f"/><rect x="10" y="22" width="44" height="24" rx="12" fill="#fff"/><path d="M22 28v12M16 34h12" stroke="#d9480f" stroke-width="4" stroke-linecap="round"/><circle cx="41" cy="31" r="3" fill="#d9480f"/><circle cx="47" cy="37" r="3" fill="#d9480f"/></svg>
    <h1>あそびラボ</h1>
  </div>
  <p class="lead">ブラウザで遊べる小さなゲームのシリーズ。Claude と一緒に作っています。インストールなしで、パソコンでもスマホでも遊べます。</p>
  <div class="tools" id="tools" hidden>
    <div class="row">
      <div class="chips" id="cats" role="group" aria-label="ジャンルでしぼる"></div>
      <div class="sort"><span id="sort-label">並び順</span><div class="seg" id="sort" role="group" aria-labelledby="sort-label">
        <button type="button" data-sort="cat">ジャンルごと</button><button type="button" data-sort="new" title="公開が新しい順">新着順</button><button type="button" data-sort="upd" title="更新が新しい順">更新順</button>
      </div></div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
  </div>
  <div id="list"></div>
  <noscript><p>ゲームの一覧を出すには JavaScript が必要です。</p></noscript>

  <p class="note">ソースコードと開発メモ: <a href="https://github.com/sishiya/asobi-lab">github.com/sishiya/asobi-lab</a><br>
  不具合やご意見は <a href="https://github.com/sishiya/asobi-lab/issues">GitHub の Issues</a> へ（GitHub のアカウントが必要です）<br>
  姉妹サイト: 学習用アプリの <a href="https://sishiya.github.io/manabi-lab/">まなびラボ</a></p>
</main>
<script>
// ゲームの一覧。並びは公開した順。新しいゲームはいちばん下に足す。
// 例: {id:'フォルダ名', title:'名前', cat:'puzzle', created:'2026-10-10', updated:'2026-10-10', desc:'一言の説明'}
// サムネイルは thumbs/<id>.jpg（640×360）。created は公開日、updated は中身が変わった日。
const GAMES = [
];
const CATS = [
  {id:'action', name:'アクション'},
  {id:'puzzle', name:'パズル'},
  {id:'sim', name:'育てる・つくる'},
  {id:'party', name:'みんなで'},
];
const SORTS = ['cat','new','upd'];
const FRESH_DAYS = 2; // きょう・きのうの公開・更新に印をつける

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const catOf = id => CATS.find(c => c.id === id);

const today = new Date(); today.setHours(0, 0, 0, 0);
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysAgo = s => Math.round((today - toDate(s)) / 864e5);
const shortDate = s => { const d = toDate(s); return (d.getFullYear() === today.getFullYear() ? '' : d.getFullYear() + '年') + (d.getMonth() + 1) + '月' + d.getDate() + '日'; };
const relDate = s => { const n = daysAgo(s); return n <= 0 ? 'きょう' : n === 1 ? 'きのう' : n < 7 ? n + '日前' : shortDate(s); };
const isFresh = s => daysAgo(s) < FRESH_DAYS;

GAMES.forEach((g, i) => { g.order = i; });

// 状態は URL に残す（再読み込み・戻る・共有で同じ表示になる）
const params = new URLSearchParams(location.search);
const state = {
  cat: CATS.some(c => c.id === params.get('cat')) ? params.get('cat') : 'all',
  sort: SORTS.includes(params.get('sort')) ? params.get('sort') : 'new',
};

function saveState() {
  const p = new URLSearchParams();
  if (state.cat !== 'all') p.set('cat', state.cat);
  if (state.sort !== 'new') p.set('sort', state.sort);
  const s = p.toString();
  history.replaceState(null, '', s ? '?' + s : location.pathname);
}

function card(g, showCat) {
  const c = catOf(g.cat);
  const updatedLater = g.updated !== g.created;
  const badge = isFresh(g.created) ? '新作' : updatedLater && isFresh(g.updated) ? '更新' : '';
  const dateHtml = (label, s) => `${label} <time datetime="${s}" title="${s}"${isFresh(s) ? ' class="fresh"' : ''}>${relDate(s)}</time>`;
  return `<div class="card c-${g.cat}">
    <div class="pic"><img class="thumb" src="thumbs/${g.id}.jpg" alt="" width="640" height="360" loading="lazy">${badge ? `<span class="badge${badge === '更新' ? ' upd' : ''}">${badge}</span>` : ''}</div>
    <div class="body">
      ${showCat && c ? `<span class="cat"><span class="dot"></span>${esc(c.name)}</span>` : ''}
      <a class="open" href="${g.id}/">${esc(g.title)}</a>
      <p>${esc(g.desc)}</p>
      <div class="foot"><span class="dates">${dateHtml('公開', g.created)}${updatedLater ? ' ・ ' + dateHtml('更新', g.updated) : ''}</span><a class="ver" href="${g.id}/launcher.html">過去の版</a></div>
    </div></div>`;
}

const EMPTY = `<div class="empty">
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="14" width="52" height="36" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><rect class="blink" x="16" y="26" width="6" height="12" fill="currentColor"/></svg>
  <div class="big">最初のゲームを準備中</div>
  <p>できあがったら、ここに並びます。</p></div>`;

function render() {
  if (!GAMES.length) { $('list').innerHTML = EMPTY; return; }
  const shown = GAMES.filter(g => state.cat === 'all' || g.cat === state.cat);
  const usedCats = CATS.filter(c => GAMES.some(g => g.cat === c.id)); // ゲームのあるジャンルだけボタンにする

  const scrollX = $('cats').scrollLeft;
  $('cats').innerHTML = [{id:'all', name:'すべて'}, ...usedCats].map(c => {
    const n = c.id === 'all' ? GAMES.length : GAMES.filter(g => g.cat === c.id).length;
    return `<button type="button" class="chip c-${c.id}" data-cat="${c.id}" aria-pressed="${state.cat === c.id}">${c.id === 'all' ? '' : '<span class="dot"></span>'}${esc(c.name)}<span class="n">${n}</span></button>`;
  }).join('');
  $('cats').scrollLeft = scrollX;
  document.querySelectorAll('#sort button').forEach(b => b.setAttribute('aria-pressed', b.dataset.sort === state.sort));
  $('status').textContent = state.cat === 'all' ? `${shown.length}本すべて` : `${catOf(state.cat).name}で ${shown.length}本`;

  if (state.sort === 'cat') {
    $('list').innerHTML = usedCats.map(c => {
      const items = shown.filter(g => g.cat === c.id);
      if (!items.length) return '';
      return `<h2 class="c-${c.id}"><span class="dot"></span>${esc(c.name)}<span class="n">${items.length}本</span></h2><div class="grid">${items.map(g => card(g, false)).join('')}</div>`;
    }).join('');
  } else {
    const key = state.sort === 'new' ? g => [g.created, g.order] : g => [g.updated, g.created, g.order];
    const sorted = [...shown].sort((x, y) => { const kx = key(x), ky = key(y); for (let i = 0; i < kx.length; i++) { if (kx[i] !== ky[i]) return kx[i] < ky[i] ? 1 : -1; } return 0; });
    $('list').innerHTML = `<div class="grid">${sorted.map(g => card(g, true)).join('')}</div>`;
  }
}

function update() { saveState(); render(); }

// 並べかえ・しぼりこみは2本以上になってから出す
$('tools').hidden = GAMES.length < 2;

const showChosenCat = () => { const c = $('cats'), b = c.querySelector('[aria-pressed=true]'); if (b && c.scrollWidth > c.clientWidth) c.scrollTo({left: b.offsetLeft - (c.clientWidth - b.offsetWidth) / 2, behavior: 'smooth'}); };
$('cats').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.cat = b.dataset.cat; update(); showChosenCat(); } });
$('sort').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.sort = b.dataset.sort; update(); } });

render();
showChosenCat();
</script>
</body>
</html>
